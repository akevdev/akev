name: Feature request
description: An idea for something Akev should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Another tool, a workaround, or not at all.
