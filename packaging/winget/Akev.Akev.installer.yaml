# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.12.0.schema.json

PackageIdentifier: Akev.Akev
PackageVersion: @VERSION@
InstallerLocale: en-US
InstallerType: nullsoft
Scope: user
InstallModes:
  - interactive
  - silent
UpgradeBehavior: install
# The desktop app's file associations (bundle.fileAssociations in tauri.conf.json).
FileExtensions:
  - akev
  - chlsj
  - har
  - saz
ProductCode: Akev
ReleaseDate: @DATE@
# What the NSIS installer registers (Tauri derives the publisher from dev.akev.desktop).
AppsAndFeaturesEntries:
  - DisplayName: Akev
    Publisher: akev
    ProductCode: Akev
InstallationMetadata:
  DefaultInstallLocation: '%LocalAppData%\Akev'
Installers:
  - Architecture: x64
    InstallerUrl: https://github.com/akevdev/akev/releases/download/v@VERSION@/Akev_@VERSION@_x64-setup.exe
    InstallerSha256: @SHA:Akev_@VERSION@_x64-setup.exe@
  - Architecture: arm64
    InstallerUrl: https://github.com/akevdev/akev/releases/download/v@VERSION@/Akev_@VERSION@_arm64-setup.exe
    InstallerSha256: @SHA:Akev_@VERSION@_arm64-setup.exe@
ManifestType: installer
ManifestVersion: 1.12.0
