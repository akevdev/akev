[package]
name = "akev-api"
description = "Akev application core: wires CA, proxy, rules, store, interceptors and serves the REST/WebSocket API + web UI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
rust-version.workspace = true
build = "build.rs"

[features]
default = ["embed-ui"]
# Embed ../../ui/dist into the binary (falls back to a placeholder page if not built).
embed-ui = []
# Browser TLS fingerprints for upstream connections (BoringSSL; see akev-proxy).
impersonate = ["akev-proxy/impersonate"]

[dependencies]
akev-core = { workspace = true }
akev-ca = { workspace = true }
akev-content = { workspace = true }
akev-codegen = { workspace = true }
akev-filter = { workspace = true }
akev-rules = { workspace = true }
akev-store = { workspace = true }
akev-proxy = { workspace = true }
akev-intercept = { workspace = true }
akev-wireguard = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
rust-embed = { workspace = true }
mime_guess = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
# Ed25519 verification of Akev Pro licence keys.
ring = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
dirs = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# Log file and recent-events layers for the binaries (`observability`).
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
tempfile = { workspace = true }
sysinfo = { workspace = true }
url = { workspace = true }
percent-encoding = { workspace = true }
arc-swap = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
# Protobuf schema registry: compiles uploaded .proto files at runtime (pure Rust).
protox = "0.10"
# Line/column of protox compile errors (its errors are miette diagnostics).
miette = { version = "7", default-features = false }
# Update checks (`updates.rs`): fetch the release manifest.
reqwest = { workspace = true }

[dev-dependencies]
tower = { workspace = true }
tokio-tungstenite = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
