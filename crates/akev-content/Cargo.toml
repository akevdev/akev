[package]
name = "akev-content"
description = "Body decoding, content detection, formatting and protocol decoders (protobuf, gRPC, msgpack, SSE...)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
akev-core = { workspace = true }
bytes = { workspace = true }
flate2 = { workspace = true }
brotli = { workspace = true }
zstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
quick-xml = { workspace = true }
base64 = { workspace = true }
memchr = { workspace = true }
percent-encoding = { workspace = true }
thiserror = { workspace = true }
encoding_rs = "0.8"
# Typed protobuf decoding with user-supplied schemas (`schema` module).
prost-reflect = { version = "0.16", features = ["serde"] }

[dev-dependencies]
# Reference decoder for the CBOR differential test.
ciborium = { workspace = true }
# Compiles the sample .proto schemas of the typed-decoding tests.
protox = "0.10"

[lints]
workspace = true
