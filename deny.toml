# cargo-deny: `cargo deny check` (CI runs it on every push; `make lint` when installed).
# Akev is AGPL-3.0-or-later, so any licence compatible with distributing it under the AGPL is
# fine; anything else (or an unknown licence) fails the check until it's reviewed here.

[graph]
all-features = true

[advisories]
# Unmaintained crates are reported but don't block (many are transitive and harmless);
# vulnerabilities always do.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "MPL-2.0",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true

[bans]
# Several major versions of common crates are expected in a tree this size; report, don't fail.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
